name: Fetch wholesale images

on:
  push:
    branches:
      - ai/wholesale-b2b
    paths:
      - .github/workflows/fetch-wholesale-images.yml

permissions:
  contents: write

jobs:
  fetch-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ai/wholesale-b2b

      - name: Download approved Otsuka-en images
        run: |
          set -e
          mkdir -p public/images/wholesale
          UA="Mozilla/5.0"
          curl -L --fail --retry 3 -A "$UA" "https://otsukaen.com/wp-content/uploads/2025/05/%E3%80%90%E3%83%AA%E3%82%B5%E3%82%A4%E3%82%BA%E3%80%91hv_02-1024x746.jpg" -o public/images/wholesale/otsuka-hero.jpg
          curl -L --fail --retry 3 -A "$UA" "https://otsukaen.com/wp-content/uploads/2025/09/%E3%80%90PC%E3%80%91%E6%8A%B9%E8%8C%B602-%E6%A0%BD%E5%9F%B9.jpg" -o public/images/wholesale/otsuka-cultivation.jpg
          curl -L --fail --retry 3 -A "$UA" "https://otsukaen.com/wp-content/uploads/2025/09/%E3%80%90PC%E3%80%91%E6%8A%B9%E8%8C%B603-%E8%A3%BD%E9%80%A0jpg.jpg" -o public/images/wholesale/otsuka-process.jpg
          curl -L --fail --retry 3 -A "$UA" "https://otsukaen.com/wp-content/uploads/2025/09/%E3%80%90PC%E3%80%91%E6%8A%B9%E8%8C%B604-%E7%B2%89%E7%A0%95%E5%8C%96.jpg" -o public/images/wholesale/otsuka-grinding.jpg

      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/wholesale
          git diff --cached --quiet && exit 0
          git commit -m "Add approved Otsuka-en wholesale photography"
          git push origin HEAD:ai/wholesale-b2b
